# ============================================================
# Grafana — Provisioned Datasources
# These are auto-loaded on startup; no manual configuration needed.
# ============================================================

apiVersion: 1

datasources:

  # ── Prometheus (default) ──────────────────────────────────
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      httpMethod:       POST
      timeInterval:     "15s"
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  # ── Loki (log aggregation) ────────────────────────────────
  - name:    Loki
    type:    loki
    uid:     loki
    access:  proxy
    url:     http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex:  '"traceId":"(\w+)"'
          name:          TraceID
          url:           '$${__value.raw}'
