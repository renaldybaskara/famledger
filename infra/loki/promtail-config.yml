# ============================================================
# Promtail Configuration — FinTrackr
# Scrapes Docker container logs via Docker service discovery
# and ships them to Loki.
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: fintrackr
    batchwait: 1s
    batchsize: 1048576   # 1 MiB

scrape_configs:

  # ── Docker container logs (auto-discover all services) ────
  - job_name: docker
    docker_sd_configs:
      - host:             unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only tail containers that belong to this compose project
          - name:   label
            values: ["com.docker.compose.project=fintrackr"]

    relabel_configs:
      # Container name  →  label "container"
      - source_labels: [__meta_docker_container_name]
        regex:         /(.*)
        target_label:  container

      # Compose service →  label "service"
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label:  service

      # Compose project →  label "project"
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label:  project

      # Drop containers with no service label (infra/sidecar)
      - source_labels: [service]
        regex:         ""
        action:        drop

    pipeline_stages:
      # Parse JSON logs (NestJS + pino emit JSON)
      - json:
          expressions:
            level:   level
            message: msg
            pid:     pid
            time:    time
      # Map pino log levels to Loki levels
      - labels:
          level:
          service:
          container:

  # ── Caddy access logs (JSON) ──────────────────────────────
  - job_name: caddy-access
    static_configs:
      - targets: [localhost]
        labels:
          job:       caddy
          service:   caddy
          log_type:  access
          __path__:  /var/log/caddy/*.log

    pipeline_stages:
      - json:
          expressions:
            ts:      ts
            status:  resp_headers.Status
            method:  request.method
            uri:     request.uri
      - labels:
          status:
          method:

  # ── System journal / syslog ───────────────────────────────
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job:      syslog
          service:  host
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '^(?P<time>\S+\s+\S+\s+\S+)\s+(?P<host>\S+)\s+(?P<service>\S+):\s+(?P<message>.*)'
      - labels:
          host:
          service:
