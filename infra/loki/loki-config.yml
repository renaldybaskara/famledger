# ============================================================
# Loki Configuration — FinTrackr (single-node, monolithic)
# Compatible with Loki v3.x
# ============================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# ── Ingester ring — single node, no distributed coordination
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  chunk_retain_period: 30s
  wal:
    dir: /loki/wal

# ── Distributor ring
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# ── Compactor
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# ── Query scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 32768

# ── Frontend
frontend:
  max_outstanding_per_tenant: 32768

# ── Schema ────────────────────────────────────────────────────
schema_config:
  configs:
    - from:         2024-01-01
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: index_
        period: 24h

# ── Storage ───────────────────────────────────────────────────
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location:         /loki/index-cache
  filesystem:
    directory: /loki/chunks

# ── Limits ────────────────────────────────────────────────────
limits_config:
  retention_period:          720h
  ingestion_rate_mb:         16
  ingestion_burst_size_mb:   32
  max_query_series:          10000
  max_query_parallelism:     8
  max_streams_per_user:      10000
  reject_old_samples:        true
  reject_old_samples_max_age: 168h

# ── Query cache ───────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled:     true
        max_size_mb: 100

# ── Ruler ─────────────────────────────────────────────────────
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  enable_api: true
