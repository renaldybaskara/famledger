# ============================================================
# Prometheus Configuration — FinTrackr
# Scrape interval: 15s | Retention: 30d (set via CLI flag)
# ============================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    cluster: fintrackr
    env:     production

# ── Alertmanager (configure if you add alertmanager) ────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# ── Recording / alert rules ──────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Scrape targets ───────────────────────────────────────────
scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── NestJS API — exposes /api/metrics (prom-client) ──────
  - job_name: fintrackr-api
    scrape_interval: 15s
    static_configs:
      - targets: ['api:4000']
    metrics_path: /api/metrics
    relabel_configs:
      - target_label: service
        replacement:  api

  # ── Caddy — built-in metrics endpoint on :2019 ────────────
  - job_name: caddy
    static_configs:
      - targets: ['caddy:2019']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement:  caddy

  # ── Node Exporter — host OS metrics ──────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: service
        replacement:  node-exporter

  # ── PostgreSQL Exporter ───────────────────────────────────
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - target_label: service
        replacement:  postgres

  # ── Redis / Valkey Exporter ───────────────────────────────
  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - target_label: service
        replacement:  redis

  # ── MinIO metrics ─────────────────────────────────────────
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['minio:9000']
    relabel_configs:
      - target_label: service
        replacement:  minio
