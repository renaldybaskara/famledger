# ============================================================
# FinTrackr — Development Overrides
#
# Exposes internal service ports to localhost for direct access
# from your IDE, DB client, Redis CLI, etc.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Tip: alias this in your shell:
#   alias dc-dev="docker compose -f docker-compose.yml -f docker-compose.dev.yml"
# ============================================================

services:

  # ── Domain defaults to localhost (no TLS) ─────────────────
  caddy:
    environment:
      DOMAIN:      localhost
      CADDY_EMAIL: ""

  # ── PostgreSQL — direct access for DB clients ─────────────
  postgres:
    ports:
      - "${DEV_PG_PORT:-5432}:5432"

  # ── Valkey / Redis — direct access ────────────────────────
  redis:
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"

  # ── MinIO — S3 API + web console ──────────────────────────
  minio:
    ports:
      - "${DEV_MINIO_PORT:-9000}:9000"      # S3 API
      - "${DEV_MINIO_CONSOLE_PORT:-9001}:9001"  # Web console

  # ── Ollama — direct model access ──────────────────────────
  ollama:
    ports:
      - "${DEV_OLLAMA_PORT:-11434}:11434"

  # ── Grafana — direct access ────────────────────────────────
  grafana:
    ports:
      - "${DEV_GRAFANA_PORT:-3001}:3000"

  # ── Prometheus — direct access ────────────────────────────
  prometheus:
    ports:
      - "${DEV_PROMETHEUS_PORT:-9090}:9090"

  # ── Uptime Kuma ────────────────────────────────────────────
  uptime-kuma:
    ports:
      - "${DEV_UPTIME_PORT:-3002}:3001"

  # ── GlitchTip ──────────────────────────────────────────────
  glitchtip:
    ports:
      - "${DEV_GLITCHTIP_PORT:-8001}:8000"

  # ── Plausible ──────────────────────────────────────────────
  plausible:
    ports:
      - "${DEV_PLAUSIBLE_PORT:-8002}:8000"

  # ── Loki ───────────────────────────────────────────────────
  loki:
    ports:
      - "${DEV_LOKI_PORT:-3100}:3100"

  # ── API — expose directly alongside Caddy ─────────────────
  api:
    environment:
      NODE_ENV: development
    ports:
      - "${DEV_API_PORT:-4000}:4000"

  # ── Watchtower — disable in dev (no auto-updates) ─────────
  watchtower:
    profiles:
      - disabled
