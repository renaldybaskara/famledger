# ============================================================
# FinTrackr — Local Development Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Exposes all internal ports to localhost for debugging.
# DO NOT use this file in production.
# ============================================================

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
  api:
    ports:
      - "4000:4000"
    networks:
      - internal
      - public
    environment:
      NODE_ENV: development
  web:
    ports:
      - "3000:80"
  postgres:
    ports:
      - "5432:5432"
  redis:
    ports:
      - "6379:6379"
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
  ollama:
    ports:
      - "11434:11434"
  grafana:
    ports:
      - "3100:3000"
  prometheus:
    ports:
      - "9090:9090"
  uptime-kuma:
    ports:
      - "3001:3001"
  glitchtip:
    ports:
      - "8000:8000"

networks:
  public:
    external: false
  internal:
    external: false
