# ============================================================
# famledger — Production Docker Compose
# ============================================================
#
# Services:
#   Caddy · Web · API · PostgreSQL · Redis
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d caddy web api postgres redis
#
# ============================================================

name: famledger

# -- Shared YAML anchors --==========================================
x-restart-policy: &restart-policy
  restart: unless-stopped

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  TZ:       ${TZ:-Asia/Jakarta}

x-api-env: &api-env
  <<: *common-env
  DATABASE_URL:          postgresql://${POSTGRES_USER:-famledger}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-famledger}
  REDIS_URL:             redis://:${REDIS_PASSWORD:-changeme}@redis:6379
  REDIS_HOST:            redis
  REDIS_PORT:            "6379"
  REDIS_PASSWORD:        ${REDIS_PASSWORD:-changeme}
  JWT_SECRET:            ${JWT_SECRET:?JWT_SECRET is required}
  JWT_REFRESH_SECRET:    ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_EXPIRES_IN:        ${JWT_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
  GOOGLE_CLIENT_ID:           ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET:       ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL:        ${GOOGLE_CALLBACK_URL:-}
  GOOGLE_GMAIL_CALLBACK_URL:  ${GOOGLE_GMAIL_CALLBACK_URL:-}
  MINIO_ENDPOINT:        minio
  MINIO_PORT:            "9000"
  MINIO_ACCESS_KEY:      ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY:      ${MINIO_SECRET_KEY:-changeme}
  MINIO_BUCKET:          ${MINIO_BUCKET:-famledger}
  MINIO_USE_SSL:         "false"
  OPENROUTER_API_KEY:    ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL:      ${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
  MIDTRANS_SERVER_KEY:   ${MIDTRANS_SERVER_KEY:-}
  MIDTRANS_CLIENT_KEY:   ${MIDTRANS_CLIENT_KEY:-}
  MIDTRANS_MERCHANT_ID:  ${MIDTRANS_MERCHANT_ID:-}
  MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
  OCR_SERVICE_URL:       ${OCR_SERVICE_URL:-http://ocr:5000}
  SMTP_HOST:             ${SMTP_HOST:-}
  SMTP_PORT:             ${SMTP_PORT:-587}
  SMTP_USER:             ${SMTP_USER:-}
  SMTP_PASS:             ${SMTP_PASS:-}
  SMTP_FROM:             ${SMTP_FROM:-famledger <noreply@localhost>}
  APP_URL:               ${APP_URL:-https://famledger.my.id}
  ENCRYPTION_KEY:        ${ENCRYPTION_KEY:-changeme_32_char_hex_placeholder}
  SELF_HOSTED_MODE:      "true"
  DISABLE_TIER_LIMITS:   ${DISABLE_TIER_LIMITS:-true}
  GLITCHTIP_DSN:         ${GLITCHTIP_DSN:-}

# ============================================================
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "2019:2019"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN:      ${DOMAIN:-famledger.my.id}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@famledger.my.id}
    networks:
      - public
      - internal
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context:    apps/web
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${API_URL:-/api}
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context:    apps/api-go
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-famledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-famledger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famledger} -d ${POSTGRES_DB:-famledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --appendfsync everysec
      --save 60 100
      --save 300 10
      --save 900 1
    volumes:
      - redis-data:/data
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ocr:
    build:
      context:    apps/ocr-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - paddle-models:/root/.paddleocr
    networks:
      - internal
      - public
    labels:
      com.fintrackr.service: ocr

# ============================================================
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  paddle-models:

# ============================================================
networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
